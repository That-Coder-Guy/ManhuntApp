<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Mobile web app meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": since iOS 26.1, translucent makes iOS
         draw a blur and dark gradient over the top of the installed app. With
         "default" the status bar is solid, in theme-color, and the page starts
         below it. (iOS reads this when the app is added to the Home Screen.) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Manhunt" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme color: the toolbar's colour (--ink-1), so the status bar blends in -->
    <meta name="theme-color" content="#0b0d14" />

    <title>Manhunt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
