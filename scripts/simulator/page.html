<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Manhunt simulator</title>
    <style>
      :root {
        --ink-0: #07090f;
        --ink-1: #0b0d14;
        --ink-2: #131722;
        --line: #262b3a;
        --text: #e8eaf1;
        --muted: #8b91a5;
        --seeker: #ff7b2c;
        --hider: #3ecf8e;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        background: var(--ink-0);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        background: var(--ink-1);
        border-bottom: 1px solid var(--line);
      }
      .bar h1 { margin: 0 6px 0 0; font-size: 15px; font-weight: 600; }
      .bar label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      select, button {
        font: inherit;
        color: var(--text);
        background: var(--ink-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
      }
      button { cursor: pointer; }
      button:hover, select:hover { border-color: #3a4156; }
      button.primary { background: var(--seeker); border-color: var(--seeker); color: #1b0d02; font-weight: 600; }
      :focus-visible { outline: 2px solid var(--seeker); outline-offset: 2px; }
      #status { margin-left: auto; color: var(--muted); }

      main { flex: 1; min-height: 0; display: flex; }
      #phones {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: repeat(var(--cols, 4), max-content);
        gap: 14px;
        justify-content: center;
        align-content: center;
        padding: 14px;
        overflow: hidden;
      }
      .phone { display: flex; flex-direction: column; gap: 6px; }
      .caption { display: flex; align-items: center; gap: 8px; height: 26px; min-width: 0; }
      .caption .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
      .caption .who { font-weight: 600; white-space: nowrap; }
      .caption .what { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .caption button { margin-left: auto; padding: 2px 8px; font-size: 12px; }
      .screen {
        width: calc(390px * var(--scale, 1));
        height: calc(844px * var(--scale, 1));
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--ink-1);
      }
      .screen iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        transform: scale(var(--scale, 1));
        transform-origin: 0 0;
      }

      aside {
        flex: none;
        width: 290px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 16px;
        background: var(--ink-1);
        border-left: 1px solid var(--line);
        overflow-y: auto;
      }
      aside h2 { margin: 0; font-size: 13px; font-weight: 600; }
      aside p { margin: 0; color: var(--muted); font-size: 12.5px; }
      #truth { width: 100%; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 12px; background: var(--ink-0); }
      #walkers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      #walkers li { display: grid; grid-template-columns: 10px 1fr; column-gap: 8px; align-items: center; }
      #walkers .dot { width: 10px; height: 10px; border-radius: 50%; }
      #walkers .name { font-weight: 600; }
      #walkers .doing { grid-column: 2; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

      @media (max-width: 760px) {
        main { flex-direction: column; overflow-y: auto; }
        #phones { flex: none; overflow: visible; }
        aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
        #truth { max-width: 320px; }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1>Manhunt simulator</h1>
      <label>Phones
        <select id="count">
          <option>1</option><option>2</option><option>3</option><option>4</option>
        </select>
      </label>
      <label>Seekers
        <select id="seekers"></select>
      </label>
      <button id="new-game" class="primary" type="button">New game</button>
      <button id="pause" type="button" aria-pressed="false">Pause movement</button>
      <span id="status" role="status"></span>
    </header>
    <main>
      <section id="phones" aria-label="Phones"></section>
      <aside>
        <h2>Where everyone really is</h2>
        <canvas id="truth" width="516" height="516" aria-label="Map of every phone's true position"></canvas>
        <ul id="walkers"></ul>
        <p>Each phone stands, walks or runs at random and stays within 350&nbsp;m of the middle. The rings are 100&nbsp;m apart.</p>
        <p>Jammers charge in 30&nbsp;seconds here, not 15&nbsp;minutes. Every other game setting is the default.</p>
      </aside>
    </main>
    <script type="module" src="/simulator/page.mjs"></script>
  </body>
</html>
